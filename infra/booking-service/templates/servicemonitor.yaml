apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: booking-service
  namespace: booking-service
  labels:
    app: booking-service
    release: prometheus
spec:
  jobLabel: booking-service
  namespaceSelector:
    matchNames:
      - booking-service  
  selector:
    matchLabels:
      app.kubernetes.io/instance: booking-service
      app.kubernetes.io/name: booking-service
  endpoints:
    - port: http  
      path: /metrics
      interval: 10s