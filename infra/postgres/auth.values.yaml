global:
  postgresql:
    auth:
      username: auth
      password: auth
      database: authdb

primary:
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

replica:
  replicaCount: 2

persistence:
  enabled: true
  size: 8Gi
  storageClass: "standard"

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    additionalLabels:
      release: prometheus
    namespace: default
    interval: 30s
    path: /metrics
    port: metrics
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m
